name: CI
on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: ~/.EasyOCR
          key: easyocr-en-v1
      - run: pip install --index-url https://download.pytorch.org/whl/cpu torch==2.8.0 torchvision==0.23.0
      - run: pip install -e ".[dev,eval]"
      - run: ruff check app tests evaluation
      - run: pytest --cov=app --cov-report=term-missing
      - run: python evaluation/run_evaluation.py
      - run: python evaluation/run_rag_evaluation.py
      - run: docker compose config --quiet
