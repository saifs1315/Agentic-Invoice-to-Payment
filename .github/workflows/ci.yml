name: CI
on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install fastapi==0.116.1 httpx==0.28.1 python-multipart==0.0.20 pydantic-settings==2.10.1 pytest==8.4.1 pytest-cov==6.2.1 ruff==0.12.9
      - run: ruff check app tests evaluation
      - run: pytest --cov=app --cov-report=term-missing
      - run: EVALUATION_FORMATS=json python evaluation/run_evaluation.py
      - run: docker compose config --quiet
