name: ledgerpilot

services:
  api:
    build: .
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql://ledgerpilot:ledgerpilot@postgres:5432/ledgerpilot}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
      LLM_EXTRACTION_ENABLED: ${LLM_EXTRACTION_ENABLED:-false}
      LLM_EXPLANATIONS_ENABLED: ${LLM_EXPLANATIONS_ENABLED:-false}
      PHOENIX_COLLECTOR_ENDPOINT: http://phoenix:4317
      ERP_MODE: mock
      MATCH_PRICE_TOLERANCE_PCT: ${MATCH_PRICE_TOLERANCE_PCT:-2.0}
      MATCH_QUANTITY_TOLERANCE_PCT: ${MATCH_QUANTITY_TOLERANCE_PCT:-0.0}
      MATCH_TOTAL_TOLERANCE_PCT: ${MATCH_TOTAL_TOLERANCE_PCT:-2.0}
      REQUIRE_HUMAN_APPROVAL: ${REQUIRE_HUMAN_APPROVAL:-false}
    ports: ["8000:8000"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: ["/tmp"]

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ledgerpilot
      POSTGRES_PASSWORD: ledgerpilot
      POSTGRES_DB: ledgerpilot
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgerpilot -d ledgerpilot"]
      interval: 5s
      timeout: 3s
      retries: 20

  ollama:
    image: ollama/ollama:0.11.4
    profiles: ["ai"]
    volumes: ["ollama-data:/root/.ollama"]
    ports: ["11434:11434"]

  phoenix:
    image: arizephoenix/phoenix:11.25.0
    profiles: ["observability"]
    ports: ["6006:6006", "4317:4317"]
    volumes: ["phoenix-data:/mnt/data"]

volumes:
  postgres-data:
  ollama-data:
  phoenix-data:
