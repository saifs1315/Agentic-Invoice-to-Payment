name: ledgerpilot

services:
  api:
    build: .
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql://ledgerpilot:ledgerpilot@postgres:5432/ledgerpilot}
      AGENT_RUNTIME: ollama
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3.5:2b-q4_K_M}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-embeddinggemma}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-300}
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-8192}
      AGENT_MAX_STEPS: ${AGENT_MAX_STEPS:-8}
      RAG_SIMILARITY_THRESHOLD: ${RAG_SIMILARITY_THRESHOLD:-0.05}
      PHOENIX_COLLECTOR_ENDPOINT: http://phoenix:4317
      ERP_MODE: http
      ERP_BASE_URL: http://mock-erp:8080
      ERP_TIMEOUT_SECONDS: ${ERP_TIMEOUT_SECONDS:-5.0}
      MATCH_PRICE_TOLERANCE_PCT: ${MATCH_PRICE_TOLERANCE_PCT:-2.0}
      MATCH_QUANTITY_TOLERANCE_PCT: ${MATCH_QUANTITY_TOLERANCE_PCT:-0.0}
      MATCH_TOTAL_TOLERANCE_PCT: ${MATCH_TOTAL_TOLERANCE_PCT:-2.0}
      MATCH_MAX_TAX_PCT: ${MATCH_MAX_TAX_PCT:-25.0}
      MATCH_MAX_FREIGHT_PCT: ${MATCH_MAX_FREIGHT_PCT:-10.0}
      MATCH_MAX_DISCOUNT_PCT: ${MATCH_MAX_DISCOUNT_PCT:-30.0}
      MAX_MONETARY_AMOUNT: ${MAX_MONETARY_AMOUNT:-1000000000.00}
      AUTO_POST_ENABLED: ${AUTO_POST_ENABLED:-true}
      REQUIRE_HUMAN_APPROVAL: ${REQUIRE_HUMAN_APPROVAL:-false}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-15}
      GRAPH_TENANT_ID: ${GRAPH_TENANT_ID:-}
      GRAPH_CLIENT_ID: ${GRAPH_CLIENT_ID:-}
      GRAPH_CLIENT_SECRET: ${GRAPH_CLIENT_SECRET:-}
      GRAPH_MAILBOX: ${GRAPH_MAILBOX:-}
      GRAPH_FOLDER: ${GRAPH_FOLDER:-Inbox}
    ports: ["8000:8000"]
    depends_on:
      postgres:
        condition: service_healthy
      mock-erp:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
      phoenix:
        condition: service_started
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: ["/tmp"]

  mock-erp:
    build: .
    command: ["uvicorn", "app.mock_erp_api:app", "--host", "0.0.0.0", "--port", "8080"]
    ports: ["8080:8080"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/erp/v1/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: ["/tmp"]

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ledgerpilot
      POSTGRES_PASSWORD: ledgerpilot
      POSTGRES_DB: ledgerpilot
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgerpilot -d ledgerpilot"]
      interval: 5s
      timeout: 3s
      retries: 20

  ollama:
    image: ollama/ollama:0.30.8
    environment:
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-8192}
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_KEEP_ALIVE: "2m"
    volumes: ["ollama-data:/root/.ollama"]
    ports: ["11434:11434"]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  ollama-init:
    image: ollama/ollama:0.30.8
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        ollama pull ${OLLAMA_MODEL:-qwen3.5:2b-q4_K_M} &&
        ollama pull ${OLLAMA_EMBEDDING_MODEL:-embeddinggemma}
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  phoenix:
    image: arizephoenix/phoenix:11.25.0
    ports: ["6006:6006", "4317:4317"]
    volumes: ["phoenix-data:/mnt/data"]
    restart: unless-stopped

volumes:
  postgres-data:
    name: ${POSTGRES_VOLUME_NAME:-ledgerpilot-unified-postgres-data}
  ollama-data:
  phoenix-data:
