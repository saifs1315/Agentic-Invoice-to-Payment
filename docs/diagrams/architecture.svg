<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc">
  <title id="title">LedgerPilot architecture</title>
  <desc id="desc">Sources flow through ingestion and AI-assisted extraction into deterministic matching, then either human review or ERP posting, with audit and observability alongside.</desc>
  <rect width="1440" height="810" fill="#f5f7fb"/>
  <text x="72" y="78" font-family="Arial" font-size="38" font-weight="700" fill="#10243e">LedgerPilot architecture</text>
  <text x="72" y="113" font-family="Arial" font-size="18" fill="#516277">AI interprets. Deterministic controls decide. Humans own exceptions.</text>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#658196"/></marker></defs>
  <g stroke="#658196" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M252 245 H330"/><path d="M252 345 H330"/><path d="M530 295 H610"/><path d="M820 295 H900"/><path d="M1100 295 H1180"/>
    <path d="M1000 365 V460"/><path d="M1105 520 H1180"/><path d="M1280 460 V365"/>
    <path d="M715 365 V640"/><path d="M1000 365 V640"/><path d="M1280 365 V640"/>
  </g>
  <g font-family="Arial">
    <rect x="72" y="195" width="180" height="100" rx="14" fill="#dff3f6" stroke="#2b8795" stroke-width="2"/><text x="162" y="237" text-anchor="middle" font-size="20" font-weight="700" fill="#123b4a">Shared mailbox</text><text x="162" y="266" text-anchor="middle" font-size="16" fill="#315564">Microsoft Graph</text>
    <rect x="72" y="315" width="180" height="80" rx="14" fill="#fff" stroke="#8da1b1" stroke-width="2"/><text x="162" y="351" text-anchor="middle" font-size="20" font-weight="700" fill="#24364a">API upload</text><text x="162" y="376" text-anchor="middle" font-size="15" fill="#526577">PDF · image · HTML</text>
    <rect x="330" y="220" width="200" height="150" rx="14" fill="#fff" stroke="#8da1b1" stroke-width="2"/><text x="430" y="263" text-anchor="middle" font-size="21" font-weight="700" fill="#24364a">Ingest + extract</text><text x="430" y="296" text-anchor="middle" font-size="16" fill="#526577">hash source</text><text x="430" y="322" text-anchor="middle" font-size="16" fill="#526577">Docling + Ollama</text><text x="430" y="348" text-anchor="middle" font-size="16" fill="#526577">evidence + confidence</text>
    <rect x="610" y="220" width="210" height="150" rx="14" fill="#10243e"/><text x="715" y="264" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">LangGraph</text><text x="715" y="296" text-anchor="middle" font-size="16" fill="#c8d8e6">state + routing</text><text x="715" y="322" text-anchor="middle" font-size="16" fill="#c8d8e6">LlamaIndex policy</text><text x="715" y="348" text-anchor="middle" font-size="16" fill="#c8d8e6">Phoenix traces</text>
    <rect x="900" y="220" width="200" height="150" rx="14" fill="#fff2cf" stroke="#b68813" stroke-width="2"/><text x="1000" y="262" text-anchor="middle" font-size="21" font-weight="700" fill="#5c450d">Control gate</text><text x="1000" y="295" text-anchor="middle" font-size="16" fill="#66552b">2-way / 3-way match</text><text x="1000" y="321" text-anchor="middle" font-size="16" fill="#66552b">tolerances + duplicate</text><text x="1000" y="347" text-anchor="middle" font-size="16" fill="#66552b">posting eligibility</text>
    <rect x="1180" y="220" width="200" height="150" rx="14" fill="#ddf6e8" stroke="#277a4d" stroke-width="2"/><text x="1280" y="262" text-anchor="middle" font-size="21" font-weight="700" fill="#17452e">ERP adapter</text><text x="1280" y="295" text-anchor="middle" font-size="16" fill="#315c46">PO + goods receipt</text><text x="1280" y="321" text-anchor="middle" font-size="16" fill="#315c46">payment journal</text><text x="1280" y="347" text-anchor="middle" font-size="16" fill="#315c46">AR open items</text>
    <rect x="900" y="460" width="210" height="120" rx="14" fill="#fee5e2" stroke="#a84c42" stroke-width="2"/><text x="1005" y="502" text-anchor="middle" font-size="21" font-weight="700" fill="#6b2922">Human review</text><text x="1005" y="534" text-anchor="middle" font-size="16" fill="#704640">approve / reject</text><text x="1005" y="559" text-anchor="middle" font-size="16" fill="#704640">named actor + comment</text>
    <rect x="1180" y="460" width="200" height="120" rx="14" fill="#ddf6e8" stroke="#277a4d" stroke-width="2"/><text x="1280" y="502" text-anchor="middle" font-size="21" font-weight="700" fill="#17452e">Post / apply</text><text x="1280" y="534" text-anchor="middle" font-size="16" fill="#315c46">idempotent journal</text><text x="1280" y="559" text-anchor="middle" font-size="16" fill="#315c46">or cash application</text>
    <rect x="560" y="640" width="720" height="90" rx="14" fill="#e9edf4" stroke="#718198" stroke-width="2"/><text x="920" y="679" text-anchor="middle" font-size="21" font-weight="700" fill="#24364a">PostgreSQL + pgvector · SHA-256 hash-chained audit ledger</text><text x="920" y="708" text-anchor="middle" font-size="16" fill="#526577">source → extraction → policy → variance → human decision → ERP response</text>
  </g>
</svg>

