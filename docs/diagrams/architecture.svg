<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc">
  <title id="title">LedgerPilot unified AP and AR architecture</title>
  <desc id="desc">A shared document layer feeds a parent LangGraph orchestrator, which dispatches to AP and AR subgraphs that use a separate Mock ERP HTTP API.</desc>
  <rect width="1440" height="810" fill="#f5f7fb"/>
  <text x="70" y="70" font-family="Arial" font-size="37" font-weight="700" fill="#10243e">LedgerPilot · unified finance orchestration</text>
  <text x="70" y="105" font-family="Arial" font-size="18" fill="#516277">Share document mechanics. Separate AP/AR controls. Revalidate at the ERP boundary.</text>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#658196"/></marker></defs>
  <g stroke="#658196" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M245 215H315"/><path d="M245 325H315"/><path d="M540 265H610"/><path d="M830 265H900"/>
    <path d="M720 350V405H790V455"/><path d="M720 350V405H1190V455"/><path d="M650 535H315"/><path d="M1050 535H315"/>
    <path d="M790 615V675"/><path d="M1190 615V675"/><path d="M1010 350V675"/>
  </g>
  <g font-family="Arial">
    <rect x="65" y="165" width="180" height="100" rx="14" fill="#dff3f6" stroke="#2b8795" stroke-width="2"/><text x="155" y="207" text-anchor="middle" font-size="20" font-weight="700" fill="#123b4a">Finance mailbox</text><text x="155" y="237" text-anchor="middle" font-size="16" fill="#315564">Microsoft Graph</text>
    <rect x="65" y="285" width="180" height="80" rx="14" fill="#fff" stroke="#8da1b1" stroke-width="2"/><text x="155" y="320" text-anchor="middle" font-size="20" font-weight="700" fill="#24364a">Document API</text><text x="155" y="346" text-anchor="middle" font-size="15" fill="#526577">PDF · image · HTML · JSON</text>
    <rect x="315" y="180" width="225" height="170" rx="14" fill="#fff" stroke="#8da1b1" stroke-width="2"/><text x="427" y="220" text-anchor="middle" font-size="20" font-weight="700" fill="#24364a">Canonical document</text><text x="427" y="253" text-anchor="middle" font-size="16" fill="#526577">PDF text · OCR · Docling</text><text x="427" y="281" text-anchor="middle" font-size="16" fill="#526577">evidence + confidence</text><text x="427" y="309" text-anchor="middle" font-size="16" fill="#526577">AP / AR / unknown</text>
    <rect x="610" y="180" width="220" height="170" rx="14" fill="#10243e"/><text x="720" y="222" text-anchor="middle" font-size="21" font-weight="700" fill="#fff">Parent LangGraph</text><text x="720" y="255" text-anchor="middle" font-size="16" fill="#c8d8e6">typed extraction</text><text x="720" y="283" text-anchor="middle" font-size="16" fill="#c8d8e6">conditional dispatch</text><text x="720" y="311" text-anchor="middle" font-size="16" fill="#c8d8e6">durable generic state</text>
    <rect x="900" y="180" width="220" height="170" rx="14" fill="#e9ddff" stroke="#6f4bb0" stroke-width="2"/><text x="1010" y="220" text-anchor="middle" font-size="20" font-weight="700" fill="#3d2768">Policy context</text><text x="1010" y="253" text-anchor="middle" font-size="16" fill="#5a4778">LlamaIndex + pgvector</text><text x="1010" y="281" text-anchor="middle" font-size="16" fill="#5a4778">AP and AR controls</text><text x="1010" y="309" text-anchor="middle" font-size="16" fill="#5a4778">Phoenix traces</text>
    <rect x="650" y="455" width="280" height="160" rx="14" fill="#fff2cf" stroke="#b68813" stroke-width="2"/><text x="790" y="496" text-anchor="middle" font-size="22" font-weight="700" fill="#5c450d">AP subgraph</text><text x="790" y="529" text-anchor="middle" font-size="16" fill="#66552b">policy → 2/3-way PO + GR</text><text x="790" y="557" text-anchor="middle" font-size="16" fill="#66552b">variance → review / journal</text><text x="790" y="585" text-anchor="middle" font-size="16" fill="#66552b">idempotent Payment Journal</text>
    <rect x="1050" y="455" width="280" height="160" rx="14" fill="#dff3f6" stroke="#2b8795" stroke-width="2"/><text x="1190" y="496" text-anchor="middle" font-size="22" font-weight="700" fill="#123b4a">AR subgraph</text><text x="1190" y="529" text-anchor="middle" font-size="16" fill="#315564">policy → open-item allocation</text><text x="1190" y="557" text-anchor="middle" font-size="16" fill="#315564">variance → correct / review</text><text x="1190" y="585" text-anchor="middle" font-size="16" fill="#315564">idempotent cash application</text>
    <rect x="70" y="455" width="245" height="160" rx="14" fill="#fee5e2" stroke="#a84c42" stroke-width="2"/><text x="192" y="495" text-anchor="middle" font-size="21" font-weight="700" fill="#6b2922">Unified review desk</text><text x="192" y="528" text-anchor="middle" font-size="16" fill="#704640">AP approve / reject</text><text x="192" y="556" text-anchor="middle" font-size="16" fill="#704640">AR correct + rematch</text><text x="192" y="584" text-anchor="middle" font-size="16" fill="#704640">named actor + comment</text>
    <rect x="520" y="675" width="820" height="90" rx="14" fill="#ddf6e8" stroke="#277a4d" stroke-width="2"/><text x="930" y="713" text-anchor="middle" font-size="21" font-weight="700" fill="#17452e">Separate Mock ERP HTTP API · PO · GR · journals · open items · cash</text><text x="930" y="742" text-anchor="middle" font-size="16" fill="#315c46">defensive revalidation + idempotency · PostgreSQL state · hash-chained audit</text>
  </g>
</svg>
