openapi: 3.1.0
info:
  title: LedgerPilot API
  description: Auditable agentic invoice-to-payment and remittance automation
  version: 0.2.0
paths:
  /api/v1/ingest-invoice:
    post:
      tags:
      - AP
      summary: Ingest Invoice
      operationId: ingest_invoice_api_v1_ingest_invoice_post
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_ingest_invoice_api_v1_ingest_invoice_post'
        required: true
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Ingest Invoice Api V1 Ingest Invoice Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/match-po:
    post:
      tags:
      - AP
      summary: Match Po
      operationId: match_po_api_v1_match_po_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MatchRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Match Po Api V1 Match Po Post
        '409':
          description: ERP business-state conflict
        '503':
          description: ERP transport or server failure
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/post-payment-journal:
    post:
      tags:
      - AP
      summary: Post Payment Journal
      operationId: post_payment_journal_api_v1_post_payment_journal_post
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          title: Idempotency-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Post Payment Journal Api V1 Post Payment Journal Post
        '409':
          description: ERP business-state conflict
        '503':
          description: ERP transport or server failure
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/exceptions/decision:
    post:
      tags:
      - Human oversight
      summary: Exception Decision
      operationId: exception_decision_api_v1_exceptions_decision_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecisionRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Exception Decision Api V1 Exceptions Decision Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/exceptions:
    get:
      tags:
      - Human oversight
      summary: List Exceptions
      operationId: list_exceptions_api_v1_exceptions_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  additionalProperties: true
                  type: object
                type: array
                title: Response List Exceptions Api V1 Exceptions Get
  /api/v1/workflows/{invoice_id}:
    get:
      tags:
      - Operations
      summary: Workflow Status
      operationId: workflow_status_api_v1_workflows__invoice_id__get
      parameters:
      - name: invoice_id
        in: path
        required: true
        schema:
          type: string
          title: Invoice Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Workflow Status Api V1 Workflows  Invoice Id  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/ingest-document:
    post:
      tags:
      - Ingestion
      summary: Ingest Document
      operationId: ingest_document_api_v1_ingest_document_post
      parameters:
      - name: workflow_hint
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/DocumentKind'
          - type: 'null'
          title: Workflow Hint
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_ingest_document_api_v1_ingest_document_post'
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Ingest Document Api V1 Ingest Document Post
        '409':
          description: ERP business-state conflict
        '503':
          description: ERP transport or server failure
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/ingest-remittance:
    post:
      tags:
      - AR
      summary: Ingest Remittance
      operationId: ingest_remittance_api_v1_ingest_remittance_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RemittanceRequest'
        required: true
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Ingest Remittance Api V1 Ingest Remittance Post
        '409':
          description: ERP business-state conflict
        '503':
          description: ERP transport or server failure
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/remittance-exceptions:
    get:
      tags:
      - AR
      - Human oversight
      summary: List Remittance Exceptions
      operationId: list_remittance_exceptions_api_v1_remittance_exceptions_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  additionalProperties: true
                  type: object
                type: array
                title: Response List Remittance Exceptions Api V1 Remittance Exceptions
                  Get
  /api/v1/remittance-exceptions/decision:
    post:
      tags:
      - AR
      - Human oversight
      summary: Remittance Exception Decision
      operationId: remittance_exception_decision_api_v1_remittance_exceptions_decision_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ARDecisionRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Remittance Exception Decision Api V1 Remittance Exceptions
                  Decision Post
        '409':
          description: ERP business-state conflict
        '503':
          description: ERP transport or server failure
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/finance-exceptions:
    get:
      tags:
      - Human oversight
      summary: List Finance Exceptions
      operationId: list_finance_exceptions_api_v1_finance_exceptions_get
      parameters:
      - name: workflow_type
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Workflow Type
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
                title: Response List Finance Exceptions Api V1 Finance Exceptions
                  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/audit-log:
    get:
      tags:
      - Audit
      summary: Audit Log
      operationId: audit_log_api_v1_audit_log_get
      parameters:
      - name: entity_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Entity Id
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 1000
          minimum: 1
          default: 100
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Audit Log Api V1 Audit Log Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/health:
    get:
      tags:
      - Operations
      summary: Health
      operationId: health_api_v1_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Health Api V1 Health Get
  /api/v1/mailbox/poll:
    post:
      tags:
      - Ingestion
      summary: Poll Mailbox
      operationId: poll_mailbox_api_v1_mailbox_poll_post
      parameters:
      - name: max_messages
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 10
          title: Max Messages
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Poll Mailbox Api V1 Mailbox Poll Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    ARCorrections:
      properties:
        customer_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Customer Id
        reference:
          anyOf:
          - type: string
          - type: 'null'
          title: Reference
        amount:
          anyOf:
          - type: number
            maximum: 1000000000.0
            exclusiveMinimum: 0.0
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          - type: 'null'
          title: Amount
        currency:
          anyOf:
          - type: string
            pattern: ^[A-Z]{3}$
          - type: 'null'
          title: Currency
        open_item_refs:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Open Item Refs
      type: object
      title: ARCorrections
    ARDecisionRequest:
      properties:
        remittance_id:
          type: string
          title: Remittance Id
        action:
          type: string
          pattern: ^(RETRY_WITH_CORRECTION|REJECT|MARK_MANUALLY_RESOLVED|APPROVE_APPLY)$
          title: Action
        actor:
          type: string
          minLength: 3
          title: Actor
        comment:
          type: string
          minLength: 3
          title: Comment
        corrections:
          anyOf:
          - $ref: '#/components/schemas/ARCorrections'
          - type: 'null'
      type: object
      required:
      - remittance_id
      - action
      - actor
      - comment
      title: ARDecisionRequest
    Body_ingest_document_api_v1_ingest_document_post:
      properties:
        file:
          type: string
          format: binary
          title: File
      type: object
      required:
      - file
      title: Body_ingest_document_api_v1_ingest_document_post
    Body_ingest_invoice_api_v1_ingest_invoice_post:
      properties:
        file:
          type: string
          format: binary
          title: File
      type: object
      required:
      - file
      title: Body_ingest_invoice_api_v1_ingest_invoice_post
    DecisionRequest:
      properties:
        invoice_id:
          type: string
          title: Invoice Id
        approved:
          type: boolean
          title: Approved
        actor:
          type: string
          minLength: 3
          title: Actor
        comment:
          type: string
          minLength: 3
          title: Comment
      type: object
      required:
      - invoice_id
      - approved
      - actor
      - comment
      title: DecisionRequest
    DocumentKind:
      type: string
      enum:
      - ap_invoice
      - ar_remittance
      - unknown
      title: DocumentKind
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    MatchRequest:
      properties:
        invoice_id:
          type: string
          title: Invoice Id
        require_goods_receipt:
          type: boolean
          title: Require Goods Receipt
          default: true
      type: object
      required:
      - invoice_id
      title: MatchRequest
    PostRequest:
      properties:
        invoice_id:
          type: string
          title: Invoice Id
      type: object
      required:
      - invoice_id
      title: PostRequest
    RemittanceRequest:
      properties:
        customer_id:
          type: string
          title: Customer Id
        reference:
          type: string
          title: Reference
        amount:
          anyOf:
          - type: number
            maximum: 1000000000.0
            exclusiveMinimum: 0.0
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Amount
        currency:
          type: string
          pattern: ^[A-Z]{3}$
          title: Currency
          default: USD
        open_item_refs:
          items:
            type: string
          type: array
          title: Open Item Refs
        source_ref:
          type: string
          title: Source Ref
          default: api
      type: object
      required:
      - customer_id
      - reference
      - amount
      - open_item_refs
      title: RemittanceRequest
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
